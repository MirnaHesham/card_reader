name: card_reader
description: Extract handwritten fields from inquiry cards using a local Ollama vision model (Qwen-VL).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^10.0.0
  printing: ^5.13.0
  image: ^4.2.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
